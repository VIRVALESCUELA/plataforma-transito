{% extends "core/base.html" %}
{% load static %}
{% block title %}Recuperar contraseña{% endblock %}
{% block extra_head %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'core/landing.css' %}?v=11">
{% endblock %}

{% block content %}
<div class="inscripcion-page">
    <section class="hero inscripcion-hero">
        <div class="card inscripcion-shell login-shell">
            <span class="chip login-title-chip">RECUPERAR CONTRASEÑA</span>
            <form class="course-form login-form" method="post">
                {% csrf_token %}
                <div class="form-grid">
                    <label class="form-field form-field-full" for="{{ form.email.id_for_label }}">
                        <span class="form-label">Correo</span>
                        {{ form.email }}
                        {{ form.email.errors }}
                    </label>
                </div>
                <div class="inscripcion-actions">
                    <button class="btn-primary" type="submit">Enviar enlace</button>
                </div>
            </form>
            <div class="auth-switch">
                <span>Ya recordaste tu clave?</span>
                <a href="{% url 'login' %}">Iniciar sesion</a>
            </div>
        </div>
    </section>
</div>
{% endblock %}
