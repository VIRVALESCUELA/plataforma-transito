{% extends "core/base.html" %}
{% load static %}
{% block title %}Cambiar contraseña{% endblock %}
{% block extra_head %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'core/landing.css' %}?v=11">
{% endblock %}

{% block content %}
<div class="inscripcion-page">
    <section class="hero inscripcion-hero">
        <div class="card inscripcion-shell login-shell">
            <span class="chip login-title-chip">CAMBIAR CONTRASEÑA</span>
            <form class="course-form login-form" method="post">
                {% csrf_token %}
                <div class="form-grid">
                    {% for field in form %}
                        <label class="form-field form-field-full" for="{{ field.id_for_label }}">
                            <span class="form-label">{{ field.label }}</span>
                            {{ field }}
                            {{ field.errors }}
                        </label>
                    {% endfor %}
                </div>
                <div class="inscripcion-actions">
                    <button class="btn-primary" type="submit">Guardar contraseña</button>
                </div>
            </form>
        </div>
    </section>
</div>
{% endblock %}
