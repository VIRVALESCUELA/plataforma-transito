{% extends "core/base.html" %}
{% load static %}
{% block title %}Contraseña actualizada{% endblock %}
{% block extra_head %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'core/landing.css' %}?v=11">
{% endblock %}

{% block content %}
<div class="inscripcion-page">
    <section class="hero inscripcion-hero">
        <div class="card inscripcion-shell login-shell">
            <span class="chip login-title-chip">CONTRASEÑA ACTUALIZADA</span>
            <p style="margin: 0; text-align: center;">
                Tu contraseña fue cambiada correctamente.
            </p>
            <div class="inscripcion-actions">
                <a class="btn-primary" href="{% url 'login' %}">Iniciar sesion</a>
            </div>
        </div>
    </section>
</div>
{% endblock %}
